<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" aria-label="NÉA Emblem">
  <defs>
    <linearGradient id="neaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E6C9" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA8232" />
      <stop offset="100%" stop-color="#84621E" />
    </linearGradient>
    <linearGradient id="neaWineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B1D35" />
      <stop offset="60%" stop-color="#481524" />
      <stop offset="100%" stop-color="#2D0B16" />
    </linearGradient>
    <radialGradient id="neaBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF7F2" stop-opacity="0.95" />
      <stop offset="85%" stop-color="#F4ECE6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E8D7B0" stop-opacity="0.6" />
    </radialGradient>
    <filter id="neaSoftShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#320C17" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Luminous Soft Pearl Backdrop Disc -->
  <circle cx="50" cy="50" r="47" fill="url(#neaBgGlow)" />

  <!-- Outer Luxury Beaded & Solid Rings -->
  <circle cx="50" cy="50" r="46.5" stroke="url(#neaGoldGrad)" stroke-width="1" opacity="0.8" />
  <circle cx="50" cy="50" r="43.5" stroke="url(#neaWineGrad)" stroke-width="1.2" />
  <circle cx="50" cy="50" r="40.5" stroke="url(#neaGoldGrad)" stroke-width="0.75" stroke-dasharray="1.5 2" opacity="0.9" />

  <!-- Botanical Bloom at Zenith (Top Star & Leaves) -->
  <path d="M 50 4 L 51.2 8.5 L 55.5 9.8 L 51.2 11 L 50 15.5 L 48.8 11 L 44.5 9.8 L 48.8 8.5 Z" fill="url(#neaGoldGrad)" />
  <path d="M 43 13.5 C 39.5 11 35 13 33 17 C 37 17 41 15 43 13.5 Z" fill="url(#neaGoldGrad)" opacity="0.9" />
  <path d="M 57 13.5 C 60.5 11 65 13 67 17 C 63 17 59 15 57 13.5 Z" fill="url(#neaGoldGrad)" opacity="0.9" />

  <!-- Botanical Flourish at Bottom Laurel -->
  <circle cx="50" cy="94" r="1.5" fill="url(#neaGoldGrad)" />
  <path d="M 44 87 C 39.5 88 35 86 32 81.5 C 36.5 83 41 85 44 87 Z" fill="url(#neaGoldGrad)" opacity="0.9" />
  <path d="M 56 87 C 60.5 88 65 86 68 81.5 C 63.5 83 59 85 56 87 Z" fill="url(#neaGoldGrad)" opacity="0.9" />

  <!-- Side Symmetry Accents -->
  <circle cx="7" cy="50" r="1.5" fill="url(#neaGoldGrad)" />
  <circle cx="93" cy="50" r="1.5" fill="url(#neaGoldGrad)" />

  <!-- Elegant 'N' Monogram with Haute Couture Serifs -->
  <g filter="url(#neaSoftShadow)">
    <!-- Main N Letterform in Wine Velvet -->
    <path d="M 33 66 L 33 34 L 38 34 L 62 57.5 L 62 34 L 67 34 L 67 66 L 62 66 L 38 42.5 L 38 66 Z" 
          fill="url(#neaWineGrad)" />
    
    <!-- Diagonal Gold Accent Ribbon -->
    <path d="M 38 40 L 62 63.5 L 62 60 L 41.5 40 Z" 
          fill="url(#neaGoldGrad)" opacity="0.95" />
          
    <!-- Classical Serif Terminals -->
    <path d="M 29.5 34 L 38 34 M 29.5 66 L 38 66 M 62 34 L 70.5 34 M 62 66 L 70.5 66" 
          stroke="url(#neaWineGrad)" stroke-width="1.4" stroke-linecap="square" />
  </g>
</svg>
